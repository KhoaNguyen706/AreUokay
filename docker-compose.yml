services:
  core:
    build: .
    ports:
      - "${CORE_PORT:-8080}:8080"
    environment:
      WORKER_URL: http://worker:8000
    depends_on:
      - worker
    restart: unless-stopped

  worker:
    build: ./worker
    restart: unless-stopped

  # docker compose run --rm replay /data/SisFall_dataset/SA01/F01_SA01_R01.txt
  replay:
    build: .
    entrypoint: ["replay", "-url", "http://core:8080/ingest?token=replay"]
    volumes:
      - ./data:/data:ro
      - ./testdata:/testdata:ro
    depends_on:
      - core
    profiles: ["tools"]
